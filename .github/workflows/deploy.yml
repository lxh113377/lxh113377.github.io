name: Deploy supermarket-web to Pages

on:
  # 2026-09-23 修：repository_dispatch 链路实测失效（supermarket-web 侧显示 success，
  # 但事件投递不到本仓库，多个推送周期无新 run）。补两个不依赖 dispatch 的触发源：
  #   push    —— CI/脚本往本仓库推一次即构建（绕开 createDispatchEvent 权限问题）
  #   schedule—— 每日兜底，即使上游链路再坏，顾客端也会自动拉最新源码重建
  push:
    branches: [main]
  schedule:
    # UTC 10:00 = 北京时间 18:00
    - cron: '0 10 * * *'
  repository_dispatch:
    types: [supermarket-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout supermarket-web source
        uses: actions/checkout@v4
        with:
          repository: lxh113377/supermarket-web
          ref: main
          path: source
          # 跨仓库拉私有源码仓库：GITHUB_TOKEN 仅限本仓库，需专用 PAT（DEPLOY_SOURCE_TOKEN）
          token: ${{ secrets.DEPLOY_SOURCE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: source

      - name: Build
        run: npm run build
        working-directory: source
        env:
          # .env 不入库，构建环境变量在此显式注入（对应 .env.example）
          VITE_CB_API_BASE: https://supermarket-web.pages.dev/web
          VITE_CB_PUBLIC_API_BASE: https://supermarket-web.pages.dev/pub
          # 纯静态托管跑不了 Pages Functions ⇒ 这个域名上同源 /api 必 404，搬进来的校园打印
          # 应用对顾客只剩一张「无法读取服务配置」的死页（2026-10-23 微信 UA 浏览器实测：
          # /api/public/config 与 /api/auth/me 全 404，传不了文件）。所以打印入口指回本站自己的
          # 提交表单：走 /upload 直传 + /pub createSubmission，两条都有跨域 CORS（白名单精确回显
          # origin），实测顾客端提交 200、后台「服务」页能取回文件本体。
          # 仍是同源 hash 路径、不是跨域跳转 —— 后者正是当年撞微信「无法确认本次跳转是否安全」
          # 拦截页的形态。开关本身只接受同源路径（见 src/pages/print/printApp.ts）。
          VITE_CAMPUS_PRINT_URL: "/#/service/print"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
