name: Deploy supermarket-web to Pages

on:
  # 2026-09-23 修：repository_dispatch 链路实测失效（supermarket-web 侧显示 success，
  # 但事件投递不到本仓库，多个推送周期无新 run）。补两个不依赖 dispatch 的触发源：
  #   push    —— CI/脚本往本仓库推一次即构建（绕开 createDispatchEvent 权限问题）
  #   schedule—— 每日兜底，即使上游链路再坏，顾客端也会自动拉最新源码重建
  push:
    branches: [main]
  schedule:
    # UTC 10:00 = 北京时间 18:00
    - cron: '0 10 * * *'
  repository_dispatch:
    types: [supermarket-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout supermarket-web source
        uses: actions/checkout@v4
        with:
          repository: lxh113377/supermarket-web
          ref: main
          path: source
          # 跨仓库拉私有源码仓库：GITHUB_TOKEN 仅限本仓库，需专用 PAT（DEPLOY_SOURCE_TOKEN）
          token: ${{ secrets.DEPLOY_SOURCE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: source

      - name: Build
        run: npm run build
        working-directory: source
        env:
          # .env 不入库，构建环境变量在此显式注入（对应 .env.example）
          VITE_CB_API_BASE: https://supermarket-web.pages.dev/web
          VITE_CB_PUBLIC_API_BASE: https://supermarket-web.pages.dev/pub
          # 打印入口**不在这里配**（2026-10-23 更正）：纯静态托管跑不了 Pages Functions，
          # 该域名上同源 /api 必 404，所以顾客端要走本站自建表单而不是搬进来的应用页。
          # 但这个分叉由 src/pages/print/printApp.ts 在**运行时**按 location.hostname 判，
          # 不是构建期开关 —— 一设构建参数，同一份源码在两个域名就产出不同的入口 bundle 名，
          # verify-release-parity 会把「两端不同批」判成红（判据没错，是我的分叉放错了层）。
          # 一份构建两域通用，才谈得上「两端同批」。

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
