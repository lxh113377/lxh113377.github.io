name: Deploy supermarket-web to Pages

on:
  repository_dispatch:
    types: [supermarket-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout supermarket-web source
        uses: actions/checkout@v4
        with:
          repository: lxh113377/supermarket-web
          ref: main
          path: source
          # 跨仓库拉私有源码仓库：GITHUB_TOKEN 仅限本仓库，需专用 PAT（DEPLOY_SOURCE_TOKEN）
          token: ${{ secrets.DEPLOY_SOURCE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: source

      - name: Build
        run: npm run build
        working-directory: source
        env:
          # .env 不入库，构建环境变量在此显式注入（对应 .env.example）
          VITE_CB_API_BASE: https://supermarket-web.pages.dev/web
          VITE_CB_PUBLIC_API_BASE: https://supermarket-web.pages.dev/pub

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
